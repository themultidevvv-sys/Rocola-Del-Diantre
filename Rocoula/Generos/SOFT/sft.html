<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reproductor de Música</title>
  <link rel="stylesheet" href="sft.css">
  <link rel="icon" href="../../Icon.png" type="image/x-icon">
</head>

<body>
  <div class="container">
    <div class="left-panel">
      <h2>Canciones Recomendadas</h2>
      <div class="song-list" id="songList">
        <div data-bg="https://miro.medium.com/v2/resize:fit:1170/1*cAmobBZDLzKWdywnOgtMng@2x.jpeg" data-audio="Musicas/Die%20With%20A%20Smile.mp3">Canción 1
          <span class="tooltip">Die With A Smile<br>
            By- Rymon</span>
        </div>

        <div data-bg="https://i.ytimg.com/vi/JXdh6LaMBCk/hq720.jpg?sqp=-oaymwEhCK4FEIIDSFryq4qpAxMIARUAAAAAGAElAADIQj0AgKJD&rs=AOn4CLBwYDukUpz_PW3wAncPio5vd2tQqw" data-audio="Musicas/LoveSick.mp3">Canción 2
          <span class="tooltip">Lovesick<br>
            By- Rymon</span>
        </div>

        <div data-bg="https://i.scdn.co/image/ab67616d00001e02d21ff4c94c34d8152622ac8e" data-audio="Musicas/Parasite%20Destroyer.mp3">Canción 3
          <span class="tooltip">Parasite Destroyer<br>
            By- Rymon</span>
        </div>

<a href="../../lists.html">
  <img class="back" src="../../Back.png">
</a>

      </div>
    </div>

    <div class="right-panel" id="rightPanel">
      <div class="wave-text">
        <p><b><span>C</span><span>H</span><span>O</span><span>O</span><span>S</span><span>E</span>
          <span>O</span><span>N</span><span>E</span></b></p>
    </div>

      <div class="background-transition" id="bgTransition"></div>
      <div class="audio-controls">
        <button class="btn" onclick="prevSong()">&#9664;</button>
        <div class="progress-bar" onclick="setProgress(event)">
          <div class="progress" id="progress"></div>
        </div>
        <button class="btn-pause" id="playPause">&#9654;</button>
        <button class="btn" onclick="nextSong()">&#9654;</button>
      </div>
    </div>
  </div>

  

  <audio id="audioPlayer"></audio>
  <script src="sft.js">
  </script>
  
</body>
</html>
