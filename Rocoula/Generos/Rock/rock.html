<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reproductor de Música</title>
  <link rel="stylesheet" href="../SOFT/sft.css">
  <link rel="icon" href="../../Icon.png" type="image/x-icon">
</head>

<body>
  <div class="container">
    <div class="left-panel">
      <h2>Canciones Recomendadas</h2>
      <div class="song-list" id="songList">
        <div data-bg="https://via.placeholder.com/800x600.png?text=Rock" data-audio="Musicas/Niña%20Primavera.mp3">
          Canción 1
          <span class="tooltip">Niña Primavera<br>
            By- Rymon</span>
        </div>

        <div data-bg="https://via.placeholder.com/800x600.png?text=Rock" data-audio="Musicas/Alguien%20Como%20Tú.mp3">
          Canción 2
          <span class="tooltip">Alguien Como Tú<br>
            By- Rymon</span>
        </div>

        <div data-bg="https://via.placeholder.com/800x600.png?text=Rock" data-audio="Musicas/Años.mp3">
          Canción 3
          <span class="tooltip">Años<br>
            By- Rymon</span>
        </div>

        <div data-bg="https://via.placeholder.com/800x600.png?text=Rock" data-audio="Musicas/Bugambilia.mp3">
          Canción 4
          <span class="tooltip">Bugambilia<br>
            By- Rymon</span>
        </div>

        <div data-bg="https://via.placeholder.com/800x600.png?text=Rock" data-audio="Musicas/La%20Gata%20Negra.mp3">
          Canción 5
          <span class="tooltip">La Gata Negra<br>
            By- Rymon</span>
        </div>

        <div data-bg="https://via.placeholder.com/800x600.png?text=Rock" data-audio="Musicas/Lenguas%20Muertas.mp3">
          Canción 6
          <span class="tooltip">Lenguas Muertas<br>
            By- Rymon</span>
        </div>

        <div data-bg="https://via.placeholder.com/800x600.png?text=Rock" data-audio="Musicas/Otro%20Final.mp3">
          Canción 7
          <span class="tooltip">Otro Final<br>
            By- Rymon</span>
        </div>

        <div data-bg="https://via.placeholder.com/800x600.png?text=Rock" data-audio="Musicas/Señor%20Tic%20Tac.mp3">
          Canción 8
          <span class="tooltip">Señor Tic Tac<br>
            By- Rymon</span>
        </div>

<a href="../../lists.html">
  <img class="back" src="../../Back.png">
</a>

      </div>
    </div>

    <div class="right-panel" id="rightPanel">
      <div class="wave-text">
        <p><b><span>C</span><span>H</span><span>O</span><span>O</span><span>S</span><span>E</span>
          <span>O</span><span>N</span><span>E</span></b></p>
    </div>

      <div class="background-transition" id="bgTransition"></div>
      <div class="audio-controls">
        <button class="btn" onclick="prevSong()">&#9664;</button>
        <div class="progress-bar" onclick="setProgress(event)">
          <div class="progress" id="progress"></div>
        </div>
        <button class="btn-pause" id="playPause">&#9654;</button>
        <button class="btn" onclick="nextSong()">&#9654;</button>
      </div>
    </div>
  </div>

  

  <audio id="audioPlayer"></audio>
  <script src="../SOFT/sft.js">
  </script>
  
</body>
</html>
