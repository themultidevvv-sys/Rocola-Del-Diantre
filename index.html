<!DOCTYPE html>
<html lang="en">
<head>

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Multi's Rocola</title>
    <link rel="stylesheet" href="estil.css">
    <link rel="icon" href="Musica%20y%20videos/Icono.ico" type="image/x-icon">
    <script>
        if (sessionStorage.getItem('pageTransition') === 'inicio') {
            document.documentElement.classList.add('transition-hold');
        }
    </script>
</head>
<body>
    <div id="modal">
        <div id="modal-content">
            <h2>¿Quieres reproducir la música de fondo?</h2>
            <button id="accept">Aceptar</button>
            <button id="decline">Rechazar</button>
        </div>
    </div>

<div class="wave-text">
    <p><b><span>M</span><span>U</span><span>L</span><span>T</span><span>I</span><span>'</span><span>S</span> 
        <span>R</span><span>O</span><span>C</span><span>O</span><span>L</span><span>A</span> 
        <span class="copy">&copy;</span><span>t</span><span>e</span><span>a</span><span>m</span></b></p>
</div>


<audio id="click-sound">
    <source src="Musica%20y%20videos/ConfirmMenu.ogg" type="audio/ogg">
</audio>

<audio id="audio" loop>
    <source src="Musica%20y%20videos/BW.mp3" type="audio/mp3">
    <source src="Musica%20y%20videos/wb.ogg" type="audio/ogg">

</audio>

    <video id="background-video" loop muted>
        <source src="Musica%20y%20videos/Fondo.mp4" type="video/mp4">

    </video>
<a href="#" class="link" aria-label="Entrar a la rocola"></a>

<div class="transition" id="transition">
    <img src="Musica%20y%20videos/Spooky%20Month.webp" >

</div>
    <script src="script.js"></script>

</html>
